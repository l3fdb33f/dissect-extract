[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dissect-extract"
version = "0.1.0"
description = "Timeline extraction and labeling using dissect.target (Python API)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 3.25.1 lacks TriggerRecord padding fields for legacy .job tasks (fox-it/dissect.target#1780).
    # Pin main until >=3.25.2 is on PyPI, then switch back to a version constraint.
    "dissect.target[full] @ git+https://github.com/fox-it/dissect.target.git@761810f2a74c8f37fed76a579a8d92fdbdbc7297",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
dissect-timeline = "dissect_extract.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.6"]
yara = ["yara-python>=4.0"]
# Pulls in every optional dissect.target parser (CIM/CLFS/LNK/Thumbcache/ETL/EXTFS/FFS/Squashfs/etc.).
# Without these, the corresponding plugins are reported as load failures by dissect (harmless but noisy).
full = ["dissect.target[full] @ git+https://github.com/fox-it/dissect.target.git@761810f2a74c8f37fed76a579a8d92fdbdbc7297"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dissect_extract*"]

[tool.setuptools.package-data]
dissect_extract = ["data/*.toml", "data/*.yar", "target_plugins/**/*.py", "target_plugins/**/ORIGIN.txt"]

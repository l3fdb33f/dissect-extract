# Remote access, remote desktop, and trust artifacts.

[meta]
narrative_user_action = "User {user} {action}"
narrative_user_only = "User {user}"
narrative_action_only = "{action}"

[[scenario]]
os = "windows"
function = "remoteaccess"
field_contains = { message = "RDP" }
action = "used remote access (RDP)"
timestamp_field = "ts"

[[scenario]]
os = "windows"
function = "evtx"
field_regex = { Provider_Name = "(?i)^Microsoft-Windows-Security-Auditing$", EventID = "^4624$" }
action = "logged on"

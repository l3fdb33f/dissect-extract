[windows.functions.remoteaccess]
action = "Remote access tool log (TeamViewer, AnyDesk, etc.): {message} ({source})"
timestamp_field = "ts"

[windows.functions."ual.client_access"]
action = "User Access Log client access (incoming client / server role use): {authenticated_user} @ {client_name} ({address}) — {role_name} ({product_name}), access_count {access_count}"
timestamp_field = "access_date"

[windows.functions."rdpcache.paths"]
action = "RDP client bitmap cache file (lateral movement artifact): {path}"
timestamp_field = "mtime"

[windows.functions."mru.mstsc"]
action = "MSTSC MRU — recent RDP target: {value} (key {key})"
timestamp_field = "regf_mtime"

[windows.functions.evtx]
action = "Event log lateral-movement signal: {Provider_Name} EventID {EventID} ({source})"
timestamp_field = "ts"
# Filtered to high-signal event IDs/providers from the Lateral Movement Analyst Reference.
field_regex = { Provider_Name = "(?i)^(Microsoft-Windows-Security-Auditing|Service Control Manager|Microsoft-Windows-TerminalServices-LocalSessionManager|Microsoft-Windows-TerminalServices-RemoteConnectionManager|Microsoft-Windows-RemoteDesktopServices-RdpCoreTS|Microsoft-Windows-TerminalServices-RDPClient|Microsoft-Windows-WMI-Activity|Microsoft-Windows-WinRM|Microsoft-Windows-PowerShell|Windows PowerShell)$", EventID = "^(4624|4625|4648|4672|4768|4769|4776|5140|4778|4779|7045|7036|4697|5860|5861|6|91|4103|4104|400|800|21|22|24|25|41|1149|131|1024|1102)$" }

[windows.functions."openssh.authorized_keys"]
action = "authorized_keys on Windows host: {comment} — {path}"
timestamp_field = "ts"

[[windows.walkfs]]
walkfs_path = "C:/Windows/System32/config/systemprofile/.ssh"
path_glob = "**/*"
action = "SYSTEM profile .ssh entry: {path}"
timestamp_field = "mtime"

[linux.functions."openssh.authorized_keys"]
action = "SSH authorized_keys: {comment} — {path}"
timestamp_field = "ts"

[linux.functions."openssh.known_hosts"]
action = "SSH known_hosts host entry: {host} — {path}"
timestamp_field = "mtime_ts"

[linux.functions.remoteaccess]
action = "Remote access log: {message} ({source})"
timestamp_field = "ts"

[linux.functions.lastlog]
action = "Last login (lastlog): user {ut_user} from {ut_host}"
timestamp_field = "ts"

[linux.functions.wtmp]
action = "Login/session event (wtmp): type {ut_type}, user {ut_user}, line {ut_line}, host {ut_host} ({ut_addr})"
timestamp_field = "ts"

[linux.functions.btmp]
action = "Failed login attempt (btmp): type {ut_type}, user {ut_user}, line {ut_line}, host {ut_host} ({ut_addr})"
timestamp_field = "ts"

[linux.functions.utmp]
action = "Current login/session state (utmp): type {ut_type}, user {ut_user}, line {ut_line}, host {ut_host} ({ut_addr})"
timestamp_field = "ts"

[linux.functions.journal]
action = "systemd journal (lateral movement / auth context): {comm} ({exe}) pid {pid} uid {uid} — {message} (unit {systemd_unit})"
timestamp_field = "ts"

[[linux.walkfs]]
walkfs_path = "/etc/ssh"
path_glob = "**/*"
action = "sshd configuration tree: {path}"
timestamp_field = "mtime"

[[linux.walkfs]]
walkfs_path = "/home"
path_substring = "/.ssh/"
path_glob = "**/*"
action = "User .ssh path: {path}"
timestamp_field = "mtime"

[macos.functions."openssh.authorized_keys"]
action = "SSH authorized_keys: {comment} — {path}"
timestamp_field = "ts"

[[macos.walkfs]]
walkfs_path = "/etc/ssh"
path_glob = "**/*"
action = "SSH server configuration: {path}"
timestamp_field = "mtime"



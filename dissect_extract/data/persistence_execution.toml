timestamp_field = "modification_time"

[[windows.walkfs]]
walkfs_path = "C:/Windows/System32/Tasks"
path_glob = "**/*"
action = "Scheduled Tasks on-disk artifact: {path}"
timestamp_field = "mtime"

[[windows.walkfs]]
walkfs_path = "C:/ProgramData/Microsoft/Windows/Start Menu/Programs/Startup"
path_glob = "**/*"
action = "All Users Startup folder entry (persistence): {path}"
timestamp_field = "mtime"

[[windows.walkfs]]
walkfs_path = "C:/Windows/Prefetch"
path_glob = "*.pf"
action = "Prefetch file (program execution artifact): {path}"
timestamp_field = "mtime"

[linux.functions.cronjobs]

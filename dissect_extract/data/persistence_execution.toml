path_glob = "**/*"
action = "systemd unit file (persistence): {path}"
timestamp_field = "mtime"

[[linux.walkfs]]
walkfs_path = "/lib/systemd/system"
path_glob = "**/*"
action = "systemd vendor unit file (persistence): {path}"
timestamp_field = "mtime"

[[linux.walkfs]]
walkfs_path = "/etc/init.d"
path_glob = "**/*"
action = "init.d script (persistence): {path}"
timestamp_field = "mtime"

[[linux.walkfs]]
walkfs_path = "/etc/rc.local"
action = "rc.local (boot persistence): {path}"
timestamp_field = "mtime"

[[linux.walkfs]]
walkfs_path = "/home"
path_substring = "/.ssh/"
path_glob = "**/*"
action = "User SSH configuration file (access / trust): {path}"
timestamp_field = "mtime"

[[linux.walkfs]]
walkfs_path = "/root"
path_substring = ".ssh"
path_glob = "**/*"
action = "Root SSH configuration file: {path}"
timestamp_field = "mtime"

[[linux.walkfs]]
walkfs_path = "/etc/profile.d"
path_glob = "**/*"
action = "profile.d script (login execution): {path}"
timestamp_field = "mtime"

[macos.functions.commandhistory]
action = "Shell command history (execution): {command}"
timestamp_field = "ts"

[macos.functions.bashhistory]
action = "Bash history (execution): {command}"
timestamp_field = "ts"

[macos.functions."openssh.authorized_keys"]

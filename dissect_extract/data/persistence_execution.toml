# Persistence & execution: plugin functions and walkfs roots per OS.
# Placeholders use record fields from each dissect plugin (see dissect docs / target-query --list).

[meta]
narrative_user_action = "User {user} {action}"
narrative_user_only = "User {user}"
narrative_action_only = "{action}"

[[scenario]]
os = "windows"
function = "runkeys"
field_contains = { command = "powershell" }
action = "ran PowerShell from a Run key"
timestamp_field = "ts"

[[scenario]]
os = "linux"
function = "services"
field_contains = { name = ".timer" }
action = "configured a systemd timer"
timestamp_field = "ts"

[[scenario]]
os = "windows"
function = "evtx"
field_regex = { Provider_Name = "(?i)^Microsoft-Windows-Security-Auditing$", EventID = "^4688$" }
action = "Event 4688: A new process has been created. Process {NewProcessName} — cmdline {CommandLine} (parent {ParentProcessName})"
timestamp_field = "ts"

[[scenario]]
os = "windows"
function = "evtx"
field_regex = { Provider_Name = "(?i)^Microsoft-Windows-Security-Auditing$", EventID = "^4698$" }
action = "Event 4698: A scheduled task was created. Task {TaskName}"
timestamp_field = "ts"

[[scenario]]
os = "windows"
function = "evtx"
field_regex = { Provider_Name = "(?i)^Microsoft-Windows-Security-Auditing$", EventID = "^4699$" }
action = "Event 4699: A scheduled task was deleted. Task {TaskName}"
timestamp_field = "ts"

[[scenario]]
os = "windows"
function = "evtx"
field_regex = { Provider_Name = "(?i)^Microsoft-Windows-Security-Auditing$", EventID = "^4700$" }
action = "Event 4700: A scheduled task was enabled. Task {TaskName}"
timestamp_field = "ts"

[[scenario]]
os = "windows"
function = "evtx"
field_regex = { Provider_Name = "(?i)^Microsoft-Windows-Security-Auditing$", EventID = "^4701$" }
action = "Event 4701: A scheduled task was disabled. Task {TaskName}"
timestamp_field = "ts"

[[scenario]]
os = "windows"
function = "evtx"
field_regex = { Provider_Name = "(?i)^Microsoft-Windows-Security-Auditing$", EventID = "^4702$" }
action = "Event 4702: A scheduled task was updated. Task {TaskName}"
timestamp_field = "ts"

[[scenario]]
os = "windows"
function = "evtx"
field_regex = { Provider_Name = "(?i)^Microsoft-Windows-TaskScheduler$", EventID = "^106$" }
action = "Event 106: User registered Task Scheduler task. Task {TaskName} (user {UserContext})"
timestamp_field = "ts"

[[scenario]]
os = "windows"
function = "evtx"
field_regex = { Provider_Name = "(?i)^Microsoft-Windows-TaskScheduler$", EventID = "^141$" }
action = "Event 141: User deleted Task Scheduler task. Task {TaskName} (user {UserName})"
timestamp_field = "ts"

[[scenario]]
os = "windows"
function = "evtx"
field_regex = { Provider_Name = "(?i)^Microsoft-Windows-TaskScheduler$", EventID = "^142$" }
action = "Event 142: User disabled Task Scheduler task. Task {TaskName} (user {UserName})"
timestamp_field = "ts"

[windows.functions.runkeys]
action = "Windows Run / RunOnce registry persistence: {command} (value {name}, key {key})"
timestamp_field = "ts"

[windows.functions.services]
